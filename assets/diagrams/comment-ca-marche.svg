<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1259 432" width="1259" height="432" role="img" aria-labelledby="yh-title yh-desc" font-family="Roboto, 'Helvetica Neue', Arial, sans-serif">
  <title id="yh-title">Comment youtube-helper fonctionne : une URL en entrée, des médias et des métadonnées en sortie, sans clé d'API</title>
  <desc id="yh-desc">Une plaque de gauche à droite. Entrée : une URL de YouTube, Vimeo, DailyMotion, Twitch VOD, SoundCloud ou de tout site pris en charge par yt-dlp. Le travail, en trois étapes numérotées : résoudre la page par yt-dlp vers un catalogue de flux ; choisir un flux, ou résoudre une URL média directe sans rien télécharger ; puis télécharger la vidéo, l'audio ou la vignette, et tirer les métadonnées d'engagement de la chaîne, de la vidéo, des commentaires et des sous-titres. Sortie : des fichiers médias et des métadonnées, sans aucune clé d'API.</desc>
  <style>
    .panel      { fill: #ffffff; stroke: #d6d6d6; stroke-width: 1.5; }
    .panel-label{ fill: #6b6b6b; font-size: 13px; font-weight: 600; letter-spacing: .08em; }
    .io         { fill: #F8F8F8; stroke: #9a9a9a; stroke-width: 1.5; }
    .stage      { fill: #FFF4E0; stroke: #FF9500; stroke-width: 1.5; }
    .core       { fill: #007AFF; stroke: #0062CC; stroke-width: 1.5; }
    .surface    { fill: #EAF3FF; stroke: #007AFF; stroke-width: 1.5; }
    .n-title    { font-size: 15px; font-weight: 600; fill: #111111; }
    .n-sub      { font-size: 12px; fill: #5a5a5a; }
    .on-dark    { fill: #ffffff; font-size: 15px; font-weight: 600; }
    .on-dark-sub{ fill: #d8e8ff; font-size: 12px; }
    .flow       { fill: none; stroke: #9a9a9a; stroke-width: 2; }
    .tie        { fill: none; stroke: #007AFF; stroke-width: 1.5; }
    .caption    { font-size: 12.5px; fill: #5a5a5a; font-style: italic; }
    .step       { font-size: 11px; font-weight: 700; fill: #B26A00;
                  font-family: 'Roboto Mono', ui-monospace, monospace; }
    .surf-label { font-size: 13px; font-weight: 600; fill: #0062CC; }

    @media (prefers-color-scheme: dark) {
      .panel      { fill: #1b1b1d; stroke: #3a3a3d; }
      .panel-label{ fill: #a0a0a6; }
      .io         { fill: #2a2a2e; stroke: #6f6f76; }
      .stage      { fill: #3a2d12; stroke: #FF9500; }
      .surface    { fill: #10243d; stroke: #4da2ff; }
      .n-title    { fill: #f2f2f4; }
      .n-sub      { fill: #b4b4ba; }
      .flow       { stroke: #7a7a82; }
      .tie        { stroke: #4da2ff; }
      .caption    { fill: #a0a0a6; }
      .step       { fill: #FFCC00; }
      .surf-label { fill: #4da2ff; }
    }
  </style>
  <defs><marker id="ah-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#9a9a9a"/></marker></defs>
  <text class="panel-label" x="28" y="40">ENTRÉE</text>
  <rect class="io" x="28" y="87" width="200" height="78" rx="10"/>
  <text class="n-title" x="128" y="120" text-anchor="middle">une URL</text>
  <text class="n-sub" x="128" y="139" text-anchor="middle">YouTube, Vimeo, Twitch, …</text>
  <path class="flow" d="M234 126 H250" marker-end="url(#ah-arrow)"/>
  <rect class="panel" x="254" y="54" width="731" height="144" rx="12"/>
  <text class="panel-label" x="274" y="76">CE QU'ELLE FAIT</text>
  <rect class="stage" x="274" y="94" width="170" height="78" rx="10"/>
  <text class="n-title" x="359" y="127" text-anchor="middle">résoudre</text>
  <text class="n-sub" x="359" y="146" text-anchor="middle">yt-dlp lit la page</text>
  <text class="step" x="285" y="110">1</text>
  <path class="flow" d="M448 133 H464" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="470" y="94" width="213" height="78" rx="10"/>
  <text class="n-title" x="577" y="127" text-anchor="middle">choisir un flux</text>
  <text class="n-sub" x="577" y="146" text-anchor="middle">ou résoudre une URL directe</text>
  <text class="step" x="481" y="110">2</text>
  <path class="flow" d="M687 133 H703" marker-end="url(#ah-arrow)"/>
  <rect class="stage" x="709" y="94" width="256" height="78" rx="10"/>
  <text class="n-title" x="837" y="127" text-anchor="middle">télécharger + lire</text>
  <text class="n-sub" x="837" y="146" text-anchor="middle">vidéo, audio, vignette, engagement</text>
  <text class="step" x="720" y="110">3</text>
  <path class="flow" d="M991 126 H1007" marker-end="url(#ah-arrow)"/>
  <text class="panel-label" x="1011" y="40">SORTIE</text>
  <rect class="io" x="1011" y="87" width="219" height="78" rx="10"/>
  <text class="n-title" x="1121" y="120" text-anchor="middle">médias + métadonnées</text>
  <text class="n-sub" x="1121" y="139" text-anchor="middle">sans clé d'API de plateforme</text>
  <rect class="core" x="419" y="232" width="420" height="54" rx="10"/>
  <text class="on-dark" x="629" y="253" text-anchor="middle">une bibliothèque, appelée pareil partout</text>
  <text class="on-dark-sub" x="629" y="272" text-anchor="middle">os-helper dessous pour la journalisation et les fichiers</text>
  <path class="tie" d="M629 286 V314 H365 V332"/>
  <path class="tie" d="M629 314 H893 V332"/>
  <path class="tie" d="M365 314 V332"/>
  <rect class="surface" x="290" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="365" y="360" text-anchor="middle">API Python</text>
  <path class="tie" d="M541 314 V332"/>
  <rect class="surface" x="466" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="541" y="360" text-anchor="middle">CLI (click)</text>
  <path class="tie" d="M717 314 V332"/>
  <rect class="surface" x="642" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="717" y="360" text-anchor="middle">FastAPI + MCP</text>
  <path class="tie" d="M893 314 V332"/>
  <rect class="surface" x="818" y="332" width="150" height="46" rx="9"/>
  <text class="surf-label" x="893" y="360" text-anchor="middle">skill d'agent</text>
  <text class="caption" x="629" y="412" text-anchor="middle">Aucune clé d'API de plateforme : les chiffres d'engagement sont lus sur la page que yt-dlp a déjà chargée, pas sur un point d'accès à quota.</text>
</svg>
